name: TomoTrackAI v0.2 — NanoTrack Mac Intel

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tracker:
    runs-on: macos-15-intel
    timeout-minutes: 55
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable Intel
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Python 3.11 Intel
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Instalar dependencias NanoTrack y PyInstaller
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            numpy==1.26.4 opencv-contrib-python-headless==4.9.0.80 pyinstaller==6.16.0

      - name: Probar motor y modelos originales con SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tomotrack-models"
          BASE=https://raw.githubusercontent.com/HonglinChu/SiamTrackers/master/NanoTrack/models/nanotrackv2
          curl -fLsS --retry 3 "$BASE/nanotrack_backbone_sim.onnx" -o "$RUNNER_TEMP/tomotrack-models/nanotrack_backbone_sim.onnx"
          curl -fLsS --retry 3 "$BASE/nanotrack_head_sim.onnx" -o "$RUNNER_TEMP/tomotrack-models/nanotrack_head_sim.onnx"
          echo "6e773a364457b78574f9f63a23b0659ee8646f8f  $RUNNER_TEMP/tomotrack-models/nanotrack_backbone_sim.onnx" | shasum -a 1 -c -
          echo "39f168489671700cf739e402dfc67d41ce648aef  $RUNNER_TEMP/tomotrack-models/nanotrack_head_sim.onnx" | shasum -a 1 -c -
          TOMOTRACK_MODELS="$RUNNER_TEMP/tomotrack-models" TOMOTRACK_SMOKE_REAL=1 python engine/tests.py

      - name: Compilar motor autónomo (sin Python del usuario)
        shell: bash
        run: |
          set -euo pipefail
          pyinstaller --noconfirm --clean --onedir --console \
            --name TomoTrackNano --distpath build-motor --workpath build-py \
            --specpath build-py engine/nanotrack_engine.py
          test -x build-motor/TomoTrackNano/TomoTrackNano
          file build-motor/TomoTrackNano/TomoTrackNano
          lipo build-motor/TomoTrackNano/TomoTrackNano -verify_arch x86_64

      - name: Compilar ROI Select nativo Intel
        run: cargo build --release --target x86_64-apple-darwin

      - name: Empaquetar efecto, puente y motor
        shell: bash
        run: |
          set -euo pipefail
          ROOT=package/TomoTrackAI_v0.2_Mac_Intel
          PLUGIN="$ROOT/TomoTrack_ROI_Select.plugin"
          PROFILE=target/x86_64-apple-darwin/release
          mkdir -p "$PLUGIN/Contents/MacOS" "$PLUGIN/Contents/Resources"
          cp "$PROFILE/libtomotrack_native.dylib" "$PLUGIN/Contents/MacOS/TomoTrack_ROI_Select"
          cp "$PROFILE/tomotrack_native.rsrc" "$PLUGIN/Contents/Resources/TomoTrack_ROI_Select.rsrc"
          printf 'eFKTFXTC' > "$PLUGIN/Contents/PkgInfo"
          cat > "$PLUGIN/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>TomoTrack_ROI_Select</string>
          <key>CFBundleIdentifier</key><string>com.tomomedina.TomoTrackROISelect</string>
          <key>CFBundleName</key><string>TomoTrack ROI Select</string>
          <key>CFBundlePackageType</key><string>eFKT</string>
          <key>CFBundleSignature</key><string>FXTC</string>
          <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
          <key>CFBundleVersion</key><string>0.1.0</string>
          <key>CFBundleShortVersionString</key><string>0.1.0</string>
          <key>LSMinimumSystemVersion</key><string>12.0</string>
          </dict></plist>
          PLIST
          plutil -lint "$PLUGIN/Contents/Info.plist"
          lipo "$PLUGIN/Contents/MacOS/TomoTrack_ROI_Select" -verify_arch x86_64
          codesign --force --deep --sign - "$PLUGIN"
          codesign --verify --verbose=2 "$PLUGIN"
          ditto build-motor/TomoTrackNano "$ROOT/TomoTrackNano"
          ditto bridge/extension "$ROOT/extension"
          cp scripts/Instalar_TomoTrackAI_02.command "$ROOT/"
          cp scripts/Desinstalar_TomoTrackAI_02.command "$ROOT/"
          chmod +x "$ROOT/"*.command
          cp TRACKING_STATUS.md "$ROOT/LEEME.md"
          (cd package && ditto -c -k --sequesterRsrc --keepParent TomoTrackAI_v0.2_Mac_Intel TomoTrackAI_v0.2_Mac_Intel.zip)

      - name: Publicar instalador Intel
        uses: actions/upload-artifact@v4
        with:
          name: TomoTrackAI_v0.2_Mac_Intel
          path: package/TomoTrackAI_v0.2_Mac_Intel.zip
          if-no-files-found: error
          retention-days: 30
