name: TomoTrackAI v0.5 PlateTrack Mac Intel

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11 Intel
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Validación de panel, ExtendScript e instalador
        shell: bash
        run: |
          set -euo pipefail
          node --check bridge/extension/panel.js
          node --check --input-type=commonjs < bridge/extension/jsx/host.jsx
          node tests/mask-sequence.test.js
          node tests/null-transform.test.js
          bash -n scripts/Instalar_TomoTrackAI.command scripts/Desinstalar_TomoTrackAI.command
          python -m py_compile engine/platetrack_engine.py engine/tests_platetrack.py
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          h=Path("bridge/extension/jsx/host.jsx").read_text()
          p=Path("bridge/extension/panel.js").read_text()
          t=Path("bridge/extension/index.html").read_text()
          assert ET.parse("bridge/extension/CSXS/manifest.xml").getroot().attrib["ExtensionBundleId"]=="com.tomo.trackai50"
          assert "platetrack-0.5.0-bridge-20261012" in h and "platetrack-0.5.0-bridge-20261012" in p
          assert "sample.matrix" in h and "s.scale_factor" in h
          assert "s.bbox[2]" not in h, "Scale nunca deriva de AABB"
          assert "TomoPlateTrack" in p and "TomoTrackNano" not in p
          assert "track_scale" not in p and "track_rotation" not in p
          for button in ("start","pause","correct","null","bar","boot","previewMode","quality"):
              assert 'id="'+button+'"' in t,button
          assert Path("engine/platetrack/tracker.py").is_file()
          assert Path("engine/platetrack/refine.py").is_file()
          print("PASS: único motor PlateTrack y matriz compartida con AE")
          PY
      - name: Dependencias CPU (sin ONNX ni modelos)
        shell: bash
        run: |
          python -m pip install --only-binary=:all: \
            numpy==1.26.4 opencv-contrib-python-headless==4.9.0.80 pyinstaller==6.16.0
      - name: Precisión geométrica y sesión real PlateTrack
        shell: bash
        run: |
          set -euo pipefail
          (cd engine && python -m unittest tests_platetrack -v)
      - name: Compilar motor nativo macOS Intel
        shell: bash
        run: |
          set -euo pipefail
          pyinstaller --noconfirm --clean --onedir --console \
            --paths engine --hidden-import platetrack.features \
            --hidden-import platetrack.lk --hidden-import platetrack.models \
            --hidden-import platetrack.refine \
            --name TomoPlateTrack --distpath build-motor \
            --workpath build-py --specpath build-py engine/platetrack_engine.py
          test -x build-motor/TomoPlateTrack/TomoPlateTrack
          lipo build-motor/TomoPlateTrack/TomoPlateTrack -verify_arch x86_64
      - name: Arranque real binario Intel
        shell: bash
        run: |
          python - <<'PY'
          import subprocess,time,select,json
          p=subprocess.Popen(['build-motor/TomoPlateTrack/TomoPlateTrack'],stdin=subprocess.PIPE,
                             stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
          start=time.monotonic()
          try:
              ok,_,_=select.select([p.stdout],[],[],25)
              assert ok,"PlateTrack no respondió tras 25 segundos"
              msg=json.loads(p.stdout.readline())
              elapsed=time.monotonic()-start
              print(f"PLATETRACK_ARRANQUE_MAC_INTEL: {elapsed:.2f} segundos")
              assert msg.get("ok") and msg.get("ready") and msg.get("engine")=="PlateTrack",msg
              p.stdin.write('{"cmd":"close"}\n');p.stdin.flush()
          finally:
              try:p.terminate();p.wait(timeout=5)
              except subprocess.TimeoutExpired:p.kill()
          PY
      - name: Empaquetar extensión CEP y motor único
        shell: bash
        run: |
          set -euo pipefail
          NAME=TomoTrackAI_v0.5.0_PlateTrack_Mac_Intel
          ROOT=package/$NAME
          mkdir -p "$ROOT"
          ditto build-motor/TomoPlateTrack "$ROOT/TomoPlateTrack"
          ditto bridge/extension "$ROOT/extension"
          cp scripts/Instalar_TomoTrackAI.command "$ROOT/"
          cp scripts/Desinstalar_TomoTrackAI.command "$ROOT/"
          cp PLATETRACK_V05_STATUS.md "$ROOT/LEEME_PRIMERO.md"
          cp PLATETRACK_ATTRIBUTION.md "$ROOT/PLATETRACK_ATTRIBUTION.md"
          chmod +x "$ROOT/"*.command
          test ! -e "$ROOT/TomoTrackNano"
          test ! -e "$ROOT/nanotrack_backbone_sim.onnx"
          (cd package && ditto -c -k --sequesterRsrc --keepParent "$NAME" "$NAME.zip")
      - name: Publicar candidato de prueba
        uses: actions/upload-artifact@v4
        with:
          name: TomoTrackAI_v0.5.0_PlateTrack_Mac_Intel
          path: package/TomoTrackAI_v0.5.0_PlateTrack_Mac_Intel.zip
          retention-days: 30
          if-no-files-found: error
