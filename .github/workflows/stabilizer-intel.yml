name: TomoTrackAI v0.6.3 Unificado Mac Intel + 4 Point Controls

on:
  pull_request:
    branches: [feature/stabilizer-manual-pins-v0.6.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stabilization:
    runs-on: macos-15-intel
    timeout-minutes: 55
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11 Mac Intel
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Validaciones panel, ExtendScript, estructura y scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check bridge/extension/panel.js
          node --check --input-type=commonjs < bridge/extension/jsx/host.jsx
          node tests/mask-sequence.test.js
          node tests/null-transform.test.js
          node tests/stabilizer-transform.test.js
          node tests/stabilizer-export-button.test.js
          node tests/native-pin-controls.test.js
          bash -n scripts/Instalar_TomoTrackAI_Unificado.command scripts/Restaurar_Paneles_TomoTrackAI.command
          python -m py_compile engine/camera_stabilization.py engine/camera_pins.py engine/platetrack_engine.py engine/tests_stabilization.py engine/tests_stabilization_integration.py engine/tests_camera_pins.py engine/tests_camera_pins_integration.py
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path("bridge/extension/panel.js").read_text()
          h=Path("bridge/extension/jsx/host.jsx").read_text()
          t=Path("bridge/extension/index.html").read_text()
          assert ET.parse("bridge/extension/CSXS/manifest.xml").getroot().attrib["ExtensionBundleId"]=="com.tomo.trackai"
          assert "platetrack-0.6.3-bridge-20261012" in p and "platetrack-0.6.3-bridge-20261012" in h
          assert "TomoTrackAI" in p and "TomoTrackAI5" not in p
          assert 'PANEL="$CEP/com.tomo.trackai"' in Path("scripts/Instalar_TomoTrackAI_Unificado.command").read_text()
          assert 'PANEL="$CEP/com.tomo.trackai"' in Path("scripts/Instalar_TomoTrackAI_Unificado.command").read_text()
          assert 'sample.matrix' in h and 's.scale_factor' in h
          assert 's.bbox[2]' not in h
          for item in ("start","pause","correct","showPins","null","stabilize","stabCrop","stabRadius","stabMode",
                       "stabStrength","workMode","modeObject","modeStabilize","previewMode","quality"):
              assert 'id="'+item+'"' in t,item
          assert "applyStabilization" in h and "prepareCameraPins" in h and "readCameraPins" in h and "clearCameraPins" in h and '"stabilize"' in Path("engine/platetrack_engine.py").read_text()
          print("PASS — un único panel canonical, 4 native AE Point Controls, motor PlateTrack conservado")
          PY
      - name: Dependencias OpenCV offline runtime (nada de ONNX)
        shell: bash
        run: |
          python -m pip install --only-binary=:all: numpy==1.26.4 opencv-contrib-python-headless==4.9.0.80 pyinstaller==6.16.0
      - name: PlateTrack actual, estabilización y end-to-end de video
        shell: bash
        run: |
          set -euo pipefail
          (cd engine && python -m unittest tests_platetrack tests_stabilization tests_stabilization_integration tests_camera_pins tests_camera_pins_integration -v)
      - name: Compilar motor único Intel para Monterey
        shell: bash
        run: |
          set -euo pipefail
          pyinstaller --noconfirm --clean --onedir --console --paths engine \
            --hidden-import platetrack.features \
            --hidden-import platetrack.lk \
            --hidden-import platetrack.models \
            --hidden-import platetrack.refine \
            --hidden-import platetrack.stabilize \
            --hidden-import camera_stabilization \
            --hidden-import camera_pins \
            --name TomoPlateTrack --distpath build-motor \
            --workpath build-py --specpath build-py engine/platetrack_engine.py
          test -x build-motor/TomoPlateTrack/TomoPlateTrack
          lipo build-motor/TomoPlateTrack/TomoPlateTrack -verify_arch x86_64
      - name: Verificar arranque real del binario Intel
        shell: bash
        run: |
          python - <<'PY'
          import subprocess,time,select,json
          p=subprocess.Popen(["build-motor/TomoPlateTrack/TomoPlateTrack"],stdin=subprocess.PIPE,
                             stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
          start=time.monotonic()
          try:
              ok,_,_=select.select([p.stdout],[],[],25)
              assert ok,"El motor Intel no responde en 25 segundos"
              data=json.loads(p.stdout.readline())
              elapsed=time.monotonic()-start
              assert data.get("ok") and data.get("ready") and data.get("engine")=="PlateTrack",data
              print(f"PLATETRACK_STABILIZER_MAC_INTEL_STARTUP={elapsed:.3f}s")
              p.stdin.write('{"cmd":"close"}\n');p.stdin.flush()
          finally:
              try:p.terminate();p.wait(timeout=5)
              except subprocess.TimeoutExpired:p.kill()
          PY
      - name: End-to-end protocolo del BINARIO Intel (video real)
        shell: bash
        run: |
          set -euo pipefail
          python engine/tests_binary_stabilization.py build-motor/TomoPlateTrack/TomoPlateTrack
      - name: Empaquetar extensión separada y motor offline
        shell: bash
        run: |
          set -euo pipefail
          NAME=TomoTrackAI_v0.6.3_Unificado_Intel
          ROOT=package/$NAME
          mkdir -p "$ROOT"
          ditto build-motor/TomoPlateTrack "$ROOT/TomoPlateTrack"
          ditto bridge/extension "$ROOT/extension"
          cp scripts/Instalar_TomoTrackAI_Unificado.command "$ROOT/"
          cp scripts/Restaurar_Paneles_TomoTrackAI.command "$ROOT/"
          cp UNIFICADO_V063_LEEME.md "$ROOT/LEEME_PRIMERO.md"
          cp PLATETRACK_ATTRIBUTION.md "$ROOT/PLATETRACK_ATTRIBUTION.md"
          chmod +x "$ROOT/"*.command
          test ! -e "$ROOT/TomoTrackNano"
          grep -q 'ExtensionBundleId="com.tomo.trackai"' "$ROOT/extension/CSXS/manifest.xml"
          grep -q 'TomoTrackAI' "$ROOT/extension/panel.js"
          (cd package && ditto -c -k --sequesterRsrc --keepParent "$NAME" "$NAME.zip")
      - name: Publicar único TomoTrackAI v0.6.3 Mac Intel
        uses: actions/upload-artifact@v4
        with:
          name: TomoTrackAI_v0.6.3_Unificado_Intel
          path: package/TomoTrackAI_v0.6.3_Unificado_Intel.zip
          retention-days: 30
          if-no-files-found: error
