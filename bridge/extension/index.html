<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>TomoTrack AI 2</title>
<style>
*{box-sizing:border-box}body{background:#202329;color:#f2f4f6;font:13px -apple-system,Arial,sans-serif;margin:0;padding:15px}
header{font-size:17px;font-weight:700;margin-bottom:5px}p{font-size:12px;color:#a4adb8;line-height:1.4}
button{border:1px solid #535d69;background:#30363f;border-radius:7px;color:white;padding:11px 9px;cursor:pointer;width:100%;text-align:center;font-size:12px}
button.primary{background:#0a6c7b;border-color:#0c91a5;font-weight:bold}
button:disabled{opacity:.4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:9px 0}
hr{border:0;border-top:1px solid #424751;margin:13px 0}
#status{line-height:1.4;min-height:57px;white-space:pre-wrap;padding-top:5px;color:#b8d6df}
#count{color:#86e0d2;font-size:11px}
</style></head><body>
<header>TomoTrack AI <small style="color:#69c5d3;font-size:11px">v0.2</small></header>
<p>Seleccioná tu video con el efecto nativo <b>TomoTrack ROI Select</b> y ubicá el recuadro.</p>
<button id="start" class="primary">▶ Analizar hacia adelante</button>
<div class="grid"><button id="step">Un fotograma</button><button id="stop" disabled>■ Detener</button></div>
<div class="grid"><button id="correct">↺ Corregir aquí</button><button id="null">Crear Null</button></div>
<button id="new">Nueva sesión</button>
<hr><div id="count">0 cuadros</div><div id="status">Iniciando motor...</div>
<p>Seguimiento local con NanoTrack V2. La selección y la trayectoria se muestran en AE.</p>
<script src="./panel.js"></script></body></html>
